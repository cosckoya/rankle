# Mypy Configuration for Rankle
# Gradual Type Checking Strategy (2026)
#
# This configuration balances strictness with practicality.
# Enable stricter checks gradually as code matures.

[mypy]
# Python version
python_version = 3.11

# Import discovery
namespace_packages = True
explicit_package_bases = True

# Exclude patterns
exclude = (?x)(
    ^tests/
    | ^venv/
    | ^\.venv/
    | ^build/
    | ^dist/
  )

# =============================================================================
# PHASE 1: QUICK WINS (Enable immediately) ✅
# =============================================================================

# Basic type checking
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True

# Warnings (catch potential bugs early)
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True

# Display options
show_error_codes = True
show_column_numbers = True
show_error_context = True
pretty = True
color_output = True

# =============================================================================
# PHASE 2: GRADUAL STRICTNESS (Enable per-module) 🎯
# =============================================================================

# DISABLED FOR NOW - Enable when ready:
# disallow_untyped_defs = False     # Require all functions have types
# disallow_any_unimported = False   # Disallow Any from untyped imports
# disallow_any_expr = False         # Disallow all Any usage

# =============================================================================
# PHASE 3: STRICT MODE (Future goal) 🚀
# =============================================================================

# When you're ready for maximum safety:
# strict = True

# =============================================================================
# Third-party Library Configuration
# =============================================================================

# Ignore missing imports for libraries without type stubs
ignore_missing_imports = True

# =============================================================================
# Per-Module Overrides
# =============================================================================

# Tests - more lenient
[mypy-tests.*]
disallow_untyped_defs = False
ignore_errors = True

# Core modules - STRICTEST (already well-typed)
[mypy-rankle.core.*]
disallow_untyped_defs = False  # TODO: Enable when ready
warn_return_any = True
check_untyped_defs = True

# Utils - Second priority for strictness
[mypy-rankle.utils.*]
disallow_untyped_defs = False  # TODO: Enable when ready
warn_return_any = True

# Detectors - Third priority
[mypy-rankle.detectors.*]
disallow_untyped_defs = False

# Modules - Fourth priority
[mypy-rankle.modules.*]
disallow_untyped_defs = False

# =============================================================================
# QUICK WIN CHECKLIST
# =============================================================================
#
# ✅ PHASE 1 - Immediate Benefits (No code changes needed):
#    - warn_return_any = True
#    - warn_unused_ignores = True
#    - strict_equality = True
#    - no_implicit_optional = True
#
# 🎯 PHASE 2 - After fixing issues (Per module):
#    - disallow_untyped_defs = True (require type hints)
#
# 🚀 PHASE 3 - Maximum Safety (Long-term goal):
#    - strict = True (all strict options)
